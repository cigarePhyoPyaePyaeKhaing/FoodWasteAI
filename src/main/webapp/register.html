<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FoodWaste AI</title><link rel="stylesheet" href="/css/auth.css"><script src="/js/auth-page.js" defer></script></head>
<body data-page="register"><main aria-labelledby="title">
<header><span class="brand">FoodWaste AI</span><select id="language" aria-label="Language / ဘာသာစကား"><option value="en">English</option><option value="mm">မြန်မာ</option></select></header>
<h1 id="title" data-text="title"></h1><p class="subtitle" data-text="subtitle"></p>
<div id="message" class="message" role="status" aria-live="polite" tabindex="-1" hidden></div>
<form novalidate>
<label for="fullName" data-text="fullName"></label><input id="fullName" name="fullName" autocomplete="name" maxlength="100" required>
<label for="email" data-text="email"></label><input id="email" name="email" type="email" autocomplete="email" maxlength="100" required>
<label for="password" data-text="password"></label><div class="password"><input id="password" name="password" type="password" autocomplete="new-password" maxlength="1024" required><button class="toggle" type="button" data-target="password" aria-controls="password" aria-pressed="false"></button></div>
<p class="hint" data-text="hint"></p><label for="confirmPassword" data-text="confirm"></label><div class="password"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="1024" required><button class="toggle" type="button" data-target="confirmPassword" aria-controls="confirmPassword" aria-pressed="false"></button></div>
<button id="submit" class="primary" type="submit" data-text="submit"></button>
</form><p class="foot"><span data-text="foot"></span> <a id="alternate" href="/login.html" data-text="link"></a></p>
</main></body></html>
