<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodWaste AI - Sign In</title>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('foodwaste_theme') || 'system';
        var resolved = saved;
        if (saved === 'system') {
          resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-mode', saved);
      } catch(e) {}
    })();
  </script>
  <!-- Global Design System & Theme Engine -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/theme.css?v=1">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/responsive.css?v=1">
  <style>
    /* Premium iOS 26 Inspired Glassmorphism Login Page */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #061224;
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(10, 132, 255, 0.14) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(0, 122, 255, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(10, 132, 255, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #07152B 0%, #020813 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif);
      color: #F5F5F7;
      padding: 1.5rem 1rem;
    }

    [data-theme="light"] body {
      background-color: #F4F8FC;
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(0, 122, 255, 0.09) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #FFFFFF 0%, #EBF4FC 100%);
      color: #0F172A;
    }

    /* Ambient Leaf Watermarks */
    .bg-leaf-decor-left {
      position: fixed;
      bottom: -60px;
      left: -40px;
      width: 320px;
      height: 320px;
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
    }

    .bg-leaf-decor-right {
      position: fixed;
      bottom: -40px;
      right: -30px;
      width: 360px;
      height: 360px;
      opacity: 0.12;
      pointer-events: none;
      z-index: 1;
    }

    /* Fixed Top Navigation Bar */
    .login-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      z-index: 20;
    }

    @media (max-width: 600px) {
      .login-topbar {
        padding: 0 1rem;
        height: 60px;
      }
    }

    /* Language Switcher Pill */
    .login-lang-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 1rem;
      background: rgba(15, 30, 55, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(65, 95, 140, 0.4);
      border-radius: 9999px;
      color: #F5F5F7;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    [data-theme="light"] .login-lang-pill-btn {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(200, 220, 245, 0.8);
      color: #0F172A;
    }

    .login-lang-pill-btn:hover {
      border-color: var(--accent-primary, #007AFF);
      box-shadow: 0 2px 10px rgba(0, 122, 255, 0.2);
    }

    /* Main Centered Authentication Glass Card */
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 1.25rem;
      position: relative;
      z-index: 10;
      margin: 60px auto 10px;
    }

    .login-card {
      background: rgba(13, 27, 49, 0.72);
      backdrop-filter: blur(36px) saturate(190%);
      -webkit-backdrop-filter: blur(36px) saturate(190%);
      border: 1px solid rgba(70, 105, 155, 0.35);
      border-radius: 30px;
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.15),
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(10, 132, 255, 0.20);
      padding: 2.5rem 2.2rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all var(--transition-smooth, 0.2s ease);
    }

    [data-theme="light"] .login-card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(210, 228, 250, 0.9);
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.9),
        0 20px 50px rgba(0, 40, 100, 0.08),
        0 0 30px rgba(0, 122, 255, 0.12);
    }

    /* App Logo Box with Leaves */
    .app-icon-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(145deg, #0A84FF 0%, #38BDF8 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(10, 132, 255, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .login-title {
      font-size: 1.7rem;
      font-weight: 800;
      color: #F5F5F7;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    [data-theme="light"] .login-title {
      color: #0F172A;
    }

    .login-subtitle {
      font-size: 0.86rem;
      color: #8DA2C0;
      font-weight: 500;
      margin-bottom: 1.75rem;
    }

    [data-theme="light"] .login-subtitle {
      color: #64748B;
    }

    /* Input Groups */
    .login-form {
      text-align: left;
    }

    .input-field-group {
      margin-bottom: 1.15rem;
    }

    .input-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94A3B8;
      margin-bottom: 0.4rem;
    }

    [data-theme="light"] .input-label {
      color: #475569;
    }

    .input-control-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 1rem;
      color: #687E9C;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
    }

    .login-input {
      width: 100%;
      height: 48px;
      background: rgba(10, 20, 38, 0.75);
      border: 1px solid rgba(65, 95, 140, 0.45);
      border-radius: 14px;
      color: #FFFFFF;
      font-size: 0.92rem;
      padding: 0 1rem 0 2.85rem;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
      box-sizing: border-box;
    }

    [data-theme="light"] .login-input {
      background: rgba(240, 246, 255, 0.8);
      border-color: rgba(200, 220, 245, 0.8);
      color: #0F172A;
    }

    .login-input:focus {
      border-color: var(--accent-primary, #007AFF);
      background: rgba(15, 30, 58, 0.95);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
    }

    [data-theme="light"] .login-input:focus {
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
    }

    .input-toggle-eye {
      position: absolute;
      right: 0.85rem;
      background: transparent;
      border: none;
      color: #687E9C;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      font-size: 1.1rem;
      transition: color 0.15s ease;
    }

    .input-toggle-eye:hover {
      color: #A8B7CC;
    }

    /* Submit Button */
    .btn-login-submit {
      width: 100%;
      height: 48px;
      margin-top: 1.35rem;
      background: linear-gradient(180deg, #0A84FF 0%, #0070E0 100%);
      border: none;
      border-radius: 14px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 6px 20px rgba(10, 132, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
    }

    .btn-login-submit:hover {
      background: linear-gradient(180deg, #2491FF 0%, #007AF0 100%);
      box-shadow: 0 8px 24px rgba(10, 132, 255, 0.55);
      transform: translateY(-1px);
    }

    .btn-login-submit:active {
      transform: translateY(0) scale(0.98);
    }

    /* Bottom Trust Line */
    .login-trust-footer {
      margin-top: 1.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #64748B;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .trust-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] .trust-divider-line {
      background: rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>

<!-- Decorative Background Watermark Leaves -->
<svg class="bg-leaf-decor-left" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M20 180C40 120 90 60 180 30C150 100 110 160 20 180Z" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M20 180C70 145 120 100 180 30" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>

<svg class="bg-leaf-decor-right" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M180 180C160 110 100 50 10 20C50 90 90 150 180 180Z" stroke="#0A84FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M180 180C125 140 70 95 10 20" stroke="#0A84FF" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>

<!-- Topbar with Language Dropdown and Segmented Theme Control -->
<header class="login-topbar">
  <button type="button" class="login-lang-pill-btn" onclick="I18n.toggleLanguage()" title="Toggle Language" aria-label="Toggle language">
    <span>🌐</span>
    <span id="login-lang-label">English</span>
    <span style="font-size:0.7rem; opacity:0.7;">⌄</span>
  </button>
  <div id="login-theme-container"></div>
</header>

<!-- Main Centered Glass Login Card -->
<main class="login-container">
  <div class="login-card">
    <div class="app-icon-badge">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 19C7 11 13 6 20 4C17 12 12 17 4 19Z" fill="#34D399"/>
        <path d="M4 19C9 14.5 14 10.5 20 4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8 12C9 7 13 4 17 3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      </svg>
    </div>

    <h1 class="login-title" data-i18n="brand.name">FoodWaste AI</h1>
    <p class="login-subtitle" data-i18n="login.subtitle">AI-powered food waste management</p>

    <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
      <div class="input-field-group">
        <label class="input-label" for="username" data-i18n="login.username">Username</label>
        <div class="input-control-box">
          <span class="input-icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input class="login-input" type="text" id="username" value="" required placeholder="e.g. admin or staff" autocomplete="username">
        </div>
      </div>

      <div class="input-field-group">
        <label class="input-label" for="password" data-i18n="login.password">Password</label>
        <div class="input-control-box">
          <span class="input-icon-left">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input class="login-input" type="password" id="password" value="" required placeholder="••••••••" autocomplete="current-password" style="padding-right: 2.85rem;">
          <button type="button" class="input-toggle-eye" onclick="togglePasswordVisibility()" title="Show/Hide Password" aria-label="Toggle password visibility">
            <svg id="eye-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login-submit" data-i18n="login.submit">
        <span data-i18n="login.submit">Sign In to Portal</span>
        <span>→</span>
      </button>
    </form>

    <div class="login-trust-footer">
      <span class="trust-divider-line"></span>
      <span style="display:flex; align-items:center; gap:0.3rem;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span data-i18n="login.secure">Secure access to your dashboard</span>
      </span>
      <span class="trust-divider-line"></span>
    </div>
  </div>
</main>

<script src="/js/theme.js?v=1"></script>
<script src="/js/i18n/en.js"></script>
<script src="/js/i18n/mm.js"></script>
<script src="/js/i18n/language.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  function updateLangLabel() {
    const lbl = document.getElementById('login-lang-label');
    if (lbl && typeof I18n !== 'undefined') {
      lbl.textContent = I18n.isMyanmar() ? 'မြန်မာ' : 'English';
    }
  }

  window.addEventListener('languageChanged', updateLangLabel);
  document.addEventListener('DOMContentLoaded', updateLangLabel);

  function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const eyeSvg = document.getElementById('eye-icon-svg');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      eyeSvg.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      `;
    } else {
      pwd.type = 'password';
      eyeSvg.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      `;
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      API.showToast('Please enter username and password', 'warning');
      return;
    }

    try {
      const res = await API.post('/api/auth/login', { username, password });
      if (res && res.data && res.data.token) {
        Auth.setUser(res.data.user, res.data.token);
        API.showToast(`Welcome back, ${res.data.user.fullName || res.data.user.username}!`, 'success');
        setTimeout(() => {
          window.location.replace('/dashboard.html');
        }, 300);
      } else {
        API.showToast(res && res.message ? res.message : 'Invalid credentials', 'error');
      }
    } catch (err) {
      console.error('Authentication error:', err);
    }
  }
</script>
</body>
</html>
